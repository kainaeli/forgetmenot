@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes sheet-up {
  from {
    transform: translateY(100%);
  }
  to {
    transform: none;
  }
}
@keyframes modal-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pop {
  0% {
    transform: scale(0.6);
  }
  60% {
    transform: scale(1.15);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes bloom {
  0% {
    transform: scale(0.2) rotate(-90deg);
    opacity: 0;
  }
  60% {
    transform: scale(1.12) rotate(8deg);
    opacity: 1;
  }
  100% {
    transform: scale(1) rotate(0);
  }
}
@keyframes scan {
  0% {
    top: -20%;
  }
  50% {
    top: 90%;
  }
  100% {
    top: -20%;
  }
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes shimmer {
  from {
    background-position: -200% 0;
  }
  to {
    background-position: 200% 0;
  }
}
@keyframes grow-x {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
.anim-rise {
  animation: rise 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.anim-fade {
  animation: fade 0.2s ease-out both;
}
.anim-pop {
  animation: pop 0.32s cubic-bezier(0.3, 1.4, 0.5, 1) both;
}
.anim-bloom {
  animation: bloom 0.42s cubic-bezier(0.3, 1.3, 0.5, 1) both;
}
.anim-toast {
  animation: toast-in 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
}
.anim-grow {
  transform-origin: left;
  animation: grow-x 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
